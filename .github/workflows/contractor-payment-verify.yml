name: Verify Contractor Hours and Payment Queue

on:
  pull_request:
    branches: [sitguru-main]
    paths:
      - "lib/staff-time/**"
      - "components/staff-time/**"
      - "app/admin/financials/contractor-hours/**"
      - "app/admin/financials/contractor-payments/**"
      - "supabase/migrations/20261115_ava_weekly_contractor_pay_periods.sql"
      - ".github/workflows/contractor-payment-verify.yml"
  workflow_dispatch:

concurrency:
  group: contractor-payment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contractor-hours:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Time period unit tests
        run: npx tsx --test lib/staff-time/periods.test.ts

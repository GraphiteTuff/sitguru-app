name: Verify Ambassador Experience

on:
  pull_request:
    branches: [sitguru-main]
    paths:
      - "app/ambassador/dashboard/**"
      - "components/ambassador/**"
      - ".github/workflows/ambassador-experience-verify.yml"

permissions:
  contents: read

concurrency:
  group: ambassador-experience-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck and build Ambassador portal
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check TypeScript
        run: npm run typecheck
      - name: Isolated production build
        run: npm run build:isolated

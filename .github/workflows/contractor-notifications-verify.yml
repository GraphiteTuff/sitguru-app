name: Verify Contractor Submission Alerts

on:
  pull_request:
    branches: [sitguru-main]
    paths:
      - "lib/realtime/**"
      - "lib/staff-time/**"
      - "components/staff-time/**"
      - "app/admin/action-center/**"
      - "scripts/contractor-notifications-invariants.test.mjs"
      - ".github/workflows/contractor-notifications-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contractor-alerts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Contractor alert invariants
        run: node --test scripts/contractor-notifications-invariants.test.mjs

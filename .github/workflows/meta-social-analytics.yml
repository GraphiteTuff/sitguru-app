name: Meta social analytics checks

on:
  pull_request:
    branches: [sitguru-main]
    paths:
      - "lib/meta/**"
      - "lib/tiktok/**"
      - "lib/x/**"
      - "app/api/integrations/x/**"
      - "app/api/integrations/tiktok/**"
      - "components/manager/ContentStudioBoard.tsx"
      - "lib/growth-center-v2/**"
      - "app/api/cron/**"
      - "app/manager/results/**"
      - "app/manager/metrics/**"
      - "app/manager/reports/**"
      - "components/portal/LiveResultsBoard.tsx"
      - "components/manager/ManagerGrowthReportingCenter.tsx"
      - "components/growth-center-v2/**"
      - "vercel.json"
      - "package.json"
      - ".github/workflows/meta-social-analytics.yml"
concurrency:
  group: meta-social-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check Node and npm
        run: |
          node --version
          npm --version
      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Run Meta API unit tests (no secrets)
        run: npm run test:meta-social
      - name: Run TikTok OAuth and draft-upload tests (no secrets)
        run: npm run test:tiktok-social
      - name: X OAuth security tests (offline; no paid X API calls)
        run: npm run test:x-social
      - name: Check TypeScript compilation
        run: npm run typecheck
      - name: Isolated production build (no real credentials)
        run: npm run build:isolated

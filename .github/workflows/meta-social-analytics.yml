name: Meta social analytics checks

on:
  pull_request:
    branches: [sitguru-main]
    paths:
      - "lib/meta/**"
      - "lib/growth-center-v2/**"
      - "app/api/cron/**"
      - "app/manager/results/**"
      - "components/growth-center-v2/**"
      - "package.json"
      - ".github/workflows/meta-social-analytics.yml"
  push:
    branches: [feature/meta-live-analytics-sync-20261115]

permissions:
  contents: read

jobs:
  test-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check Node and npm
        run: |
          node --version
          npm --version
      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Run Meta API unit tests (no secrets)
        run: npm run test:meta-social
      - name: Check TypeScript compilation
        run: npm run typecheck

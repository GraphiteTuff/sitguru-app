name: Verify SitGuru Social Intelligence

on:
  pull_request:
    branches: [sitguru-main]
    paths:
      - "lib/social-intelligence/**"
      - "lib/guru-match/**"
      - "components/guru-match/**"
      - "app/api/guru-match/**"
      - "app/api/content-studio/snapshot/**"
      - "app/s/g/**"
      - "app/go/guru-match/**"
      - "app/manager/community-studio/guru-match/**"
      - "app/intern/community-studio/guru-match/**"
      - "app/admin/growth/guru-match/**"
      - "supabase/migrations/20261123_guru_match_share_tracking.sql"
      - "components/social-intelligence/**"
      - "app/api/social-intelligence/**"
      - "app/api/cron/social-intelligence-sync/**"
      - "app/go/post/**"
      - "app/manager/metrics/**"
      - "app/manager/campaigns-content/**"
      - "app/intern/social-intelligence/**"
      - "app/admin/growth/social-intelligence/**"
      - "sitguru-mobile/**"
      - "supabase/migrations/20261122_social_intelligence.sql"
      - ".github/workflows/social-intelligence-verify.yml"

permissions:
  contents: read

jobs:
  web:
    name: Typecheck web dashboard and API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - name: Install app dependencies
        run: npm ci --ignore-scripts
      - name: Check web TypeScript
        run: npm run typecheck
      - name: Test strict Guru matching
        run: npx tsx --test lib/guru-match/matching.test.ts
      - name: Build web in isolated mode
        run: npm run build:isolated

  mobile:
    name: Typecheck Expo Social Intelligence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sitguru-mobile
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sitguru-mobile/package-lock.json
      - name: Install Expo dependencies
        run: npm ci --ignore-scripts
      - name: Check native TypeScript
        run: npm run typecheck

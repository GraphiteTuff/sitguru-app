name: Verify Internship Learning and Growth Center

on:
  pull_request:
    branches: [sitguru-main]
    paths:
      - "app/**/internship/**"
      - "app/intern/**"
      - "app/manager/**"
      - "components/internship/**"
      - "lib/internship/**"
      - "scripts/*preview*"
      - "scripts/internship-migration-smoke.mjs"
      - "supabase/migrations/*internship*"
      - "sitguru-mobile/src/app/intern-learning.tsx"
      - "vercel.json"
      - ".github/workflows/internship-release-verify.yml"

permissions:
  contents: read

concurrency:
  group: internship-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sitguru-mobile/package-lock.json
      - run: npm ci --include=dev
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:sitguru3
      - run: npm run test:desks
      - run: node --import tsx --test lib/internship/*.test.ts
      - run: node scripts/internship-migration-smoke.mjs
      - run: npm run build:isolated
      - run: npm ci --include=dev
        working-directory: sitguru-mobile
      - run: npm run typecheck
        working-directory: sitguru-mobile
